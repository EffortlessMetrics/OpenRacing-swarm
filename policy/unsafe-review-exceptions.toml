schema_version = "1.0"

# Unsafe-review exceptions are not safety waivers. They are the owned inventory
# of unsafe seams that are not yet review-closure satisfied. Remove or narrow
# entries as local contracts, guards, and witnesses land.

[[exception]]
id = "unsafe-test-harnesses"
owner = "core"
path = "crates/**/tests/**"
kind = "test_harness_unsafe"
reason = "Test-only unsafe usage is not part of the product unsafe denominator, but it must remain visible so test helpers do not hide production assumptions."
test_surface = [
  "cargo xtask unsafe-review-closure --check",
  "cargo test --locked --workspace --all-targets",
]
review_after = "2026-09-30"
removal_condition = "Test-only unsafe seams are either removed, moved behind reviewed helpers, or tracked by a dedicated test-harness unsafe ledger."
safety_contract = "not_applicable"
local_guard = "not_applicable"
witness = "present"

[[exception]]
id = "unsafe-cli-process-and-env-seams"
owner = "cli"
path = "crates/cli/**"
kind = "platform_or_process_unsafe"
reason = "Retired after the unsafe-review scanner reported zero tracked unsafe sites under crates/cli/**; future CLI unsafe seams must be reintroduced as active owned entries."
test_surface = [
  "cargo xtask unsafe-review-closure --check",
  "cargo test --locked -p wheelctl --bin wheelctl -- --nocapture",
]
review_after = "2026-06-30"
removal_condition = "Reopen only if a tracked unsafe site lands under crates/cli/**."
safety_contract = "missing"
local_guard = "missing"
witness = "missing"
status = "retired"

