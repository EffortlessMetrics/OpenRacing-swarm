name: Droid Tag

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: droid-tag-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize explicit PR command
    if: >-
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      command: ${{ steps.gate.outputs.command }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
    steps:
      - name: Resolve command and current PR head
        id: gate
        shell: bash
        env:
          BODY: ${{ github.event.comment.body || github.event.review.body || '' }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          command="$(python3 - <<'PY'
          import os
          import re

          body = os.environ.get("BODY", "")
          match = re.search(
              r"^\s*@droid\s+(review|fill|security)(?:\s|$)",
              body,
              re.MULTILINE | re.IGNORECASE,
          )
          print(match.group(1).lower() if match else "")
          PY
          )"

          emit() {
            local eligible="$1" reason="$2" head_sha="${3:-}"
            {
              echo "eligible=$eligible"
              echo "command=$command"
              echo "head_sha=$head_sha"
              echo "pr_number=$PR_NUMBER"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### Droid Tag authorization"
              echo ""
              echo "- eligible: \`$eligible\`"
              echo "- reason: \`$reason\`"
              echo "- command: \`${command:-none}\`"
              echo "- PR: \`$PR_NUMBER\`"
              echo "- captured head: \`${head_sha:-none}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ -z "$command" ]; then
            emit false no_explicit_command
            exit 0
          fi

          pr_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -er '.state' <<<"$pr_json")"
          head_repo="$(jq -er '.head.repo.full_name // empty' <<<"$pr_json")"
          head_sha="$(jq -er '.head.sha // empty' <<<"$pr_json")"

          if [ "$state" != "open" ]; then
            emit false pull_request_not_open "$head_sha"
            exit 0
          fi
          if [ "$head_repo" != "$REPOSITORY" ]; then
            emit false fork_pull_request "$head_sha"
            exit 0
          fi

          emit true authorized_same_repository_command "$head_sha"

  droid:
    name: Run explicit Droid command
    needs: authorize
    if: needs.authorize.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout captured PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record bounded invocation
        shell: bash
        run: |
          {
            echo "### Explicit Droid invocation"
            echo ""
            echo "- PR: \`${{ needs.authorize.outputs.pr_number }}\`"
            echo "- command: \`${{ needs.authorize.outputs.command }}\`"
            echo "- captured head: \`${{ needs.authorize.outputs.head_sha }}\`"
            echo "- advisory: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Droid command (advisory)
        id: droid
        continue-on-error: true
        uses: EffortlessMetrics/droid-action-safe@7c1377ccbacddc95560d1570547a5baa51de01ec
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          github_token: ${{ github.token }}
          upload_debug_artifacts: false
          show_full_output: false
          security_block_on_critical: false
          security_block_on_high: false

      - name: Report advisory command failure
        if: always() && steps.droid.outcome == 'failure'
        shell: bash
        run: echo "::warning::Explicit Droid command failed; deterministic repository checks remain authoritative."
