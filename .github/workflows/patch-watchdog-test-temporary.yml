name: Temporary Watchdog Assertion Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "crates/engine/src/safety/watchdog_safety_deep_tests.rs"
      - ".github/workflows/patch-watchdog-test-temporary.yml"

permissions:
  contents: write

concurrency:
  group: watchdog-assertion-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.event.pull_request.number == 305 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/watchdog-timing-304'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Replace the weak timeout oracle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/engine/src/safety/watchdog_safety_deep_tests.rs")
          text = path.read_text(encoding="utf-8")
          old = '''    system.age_last_communication(communication_timeout + Duration::from_millis(1));
              let result = system.process_tick(10.0);
              assert!(
                  result.fault_occurred,
                  "An expired communication timeout must fault"
              );
          '''
          new = '''    system.age_last_communication(communication_timeout + Duration::from_millis(1));
              let result = system.process_tick(10.0);
              assert_eq!(
                  result.torque_command, 0.0,
                  "Communication loss must command zero torque"
              );
              assert!(result.fault_occurred, "Communication loss must be reported");
              assert_eq!(
                  result.fault_type,
                  Some(FaultType::UsbStall),
                  "Communication loss must report the USB-stall fault contract"
              );
              assert!(
                  matches!(
                      result.state,
                      SafetyInterlockState::SafeMode {
                          triggered_by: SafetyTrigger::CommunicationLoss,
                          ..
                      }
                  ),
                  "Communication loss must enter the matching safe-mode state"
              );
          '''
          if text.count(old) != 1:
              raise SystemExit("expected watchdog assertion block was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit the bounded correction and remove this workflow
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/patch-watchdog-test-temporary.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git diff --cached --check
          git commit -m "test(engine): assert communication-loss safety contract"
          git push origin "HEAD:${HEAD_REF}"
