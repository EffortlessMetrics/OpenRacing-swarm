name: Watchdog Contract Refresh Temporary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/watchdog-contract-refresh-temporary.yml"

permissions:
  contents: write

concurrency:
  group: watchdog-contract-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/watchdog-timing-304'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the same-repository PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Strengthen the communication-loss oracle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/engine/src/safety/watchdog_safety_deep_tests.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    system.age_last_communication(communication_timeout + Duration::from_millis(1));
              let result = system.process_tick(10.0);
              assert!(
                  result.fault_occurred,
                  "An expired communication timeout must fault"
              );
          '''
          new = '''    system.age_last_communication(communication_timeout + Duration::from_millis(1));
              let result = system.process_tick(10.0);
              assert!(
                  result.fault_occurred,
                  "An expired communication timeout must fault"
              );
              assert_eq!(result.torque_command, 0.0);
              assert_eq!(result.fault_type, Some(FaultType::UsbStall));
              assert!(matches!(
                  result.state,
                  SafetyInterlockState::SafeMode {
                      triggered_by: SafetyTrigger::CommunicationLoss,
                      ..
                  }
              ));
          '''
          if new in text:
              print('Watchdog contract is already strengthened.')
          elif text.count(old) == 1:
              path.write_text(text.replace(old, new), encoding='utf-8')
          else:
              raise SystemExit('expected watchdog assertion block was not found exactly once')
          PY
          python scripts/cargo_fmt_workspace.py
          git diff --check

      - name: Verify the focused contract
        run: |
          cargo +stable test --locked -p racing-wheel-engine --lib \
            safety::watchdog_safety_deep_tests::test_communication_refresh_prevents_loss \
            -- --exact
          cargo +stable clippy --locked -p racing-wheel-engine --lib -- -D warnings

      - name: Commit the corrected contract when it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/engine/src/safety/watchdog_safety_deep_tests.rs; then
            echo "Watchdog contract is already current."
            exit 0
          fi
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add crates/engine/src/safety/watchdog_safety_deep_tests.rs
          git commit -m "test(engine): assert exact communication-loss fault"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
