name: Patch CurveLut Finite Contract

on:
  push:
    branches: [fix/curve-lut-finite-312]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/curve-lut-finite-312
          fetch-depth: 1
      - name: Apply bounded CurveLut validation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/openracing-curves/src/lut.rs')
          text = path.read_text()

          import_anchor = 'use crate::bezier::BezierCurve;\n'
          if text.count(import_anchor) != 1:
              raise SystemExit('unexpected Bezier import anchor count')
          text = text.replace(
              import_anchor,
              import_anchor + 'use crate::error::CurveError;\n',
              1,
          )

          old_bezier = '''    pub fn from_bezier(curve: &BezierCurve) -> Self {\n        let mut table = [0.0f32; Self::SIZE];\n\n        for (i, entry) in table.iter_mut().enumerate() {\n            let input = i as f32 / (Self::SIZE - 1) as f32;\n            *entry = curve.map(input);\n        }\n\n        Self { table }\n    }\n'''
          new_bezier = '''    pub fn from_bezier(curve: &BezierCurve) -> Self {\n        let mut table = [0.0f32; Self::SIZE];\n\n        for (i, entry) in table.iter_mut().enumerate() {\n            let input = i as f32 / (Self::SIZE - 1) as f32;\n            *entry = Self::sanitize_generated_value(curve.map(input));\n        }\n\n        Self { table }\n    }\n'''
          if text.count(old_bezier) != 1:
              raise SystemExit('unexpected from_bezier anchor count')
          text = text.replace(old_bezier, new_bezier, 1)

          old_from_fn = '''    pub fn from_fn<F>(f: F) -> Self\n    where\n        F: Fn(f32) -> f32,\n    {\n        let mut table = [0.0f32; Self::SIZE];\n\n        for (i, entry) in table.iter_mut().enumerate() {\n            let input = i as f32 / (Self::SIZE - 1) as f32;\n            *entry = f(input).clamp(0.0, 1.0);\n        }\n\n        Self { table }\n    }\n'''
          new_from_fn = '''    pub fn from_fn<F>(f: F) -> Self\n    where\n        F: Fn(f32) -> f32,\n    {\n        let mut table = [0.0f32; Self::SIZE];\n\n        for (i, entry) in table.iter_mut().enumerate() {\n            let input = i as f32 / (Self::SIZE - 1) as f32;\n            *entry = Self::sanitize_generated_value(f(input));\n        }\n\n        Self { table }\n    }\n\n    /// Strictly construct a LUT from a raw 256-entry table.\n    ///\n    /// Unlike the compatibility `from_fn` generator, raw/user-supplied table\n    /// data is never sanitized: the first non-finite entry is rejected with its\n    /// index. Finite values outside `[0,1]` retain the existing raw-table\n    /// acceptance policy; this method narrows only non-finite acceptance.\n    pub fn try_from_table(table: [f32; 256]) -> Result<Self, CurveError> {\n        Self::validate_table(&table)?;\n        Ok(Self { table })\n    }\n\n    /// Strictly generate a LUT from a closure.\n    ///\n    /// Finite outputs keep the existing `[0,1]` clamp. The first non-finite\n    /// generated output is rejected instead of being sanitized.\n    pub fn try_from_fn<F>(f: F) -> Result<Self, CurveError>\n    where\n        F: Fn(f32) -> f32,\n    {\n        let mut table = [0.0f32; Self::SIZE];\n\n        for (i, entry) in table.iter_mut().enumerate() {\n            let input = i as f32 / (Self::SIZE - 1) as f32;\n            let value = f(input);\n            if !value.is_finite() {\n                return Err(Self::non_finite_error(i));\n            }\n            *entry = value.clamp(0.0, 1.0);\n        }\n\n        Ok(Self { table })\n    }\n\n    /// Normalize generated values for the legacy infallible constructors.\n    ///\n    /// Finite values keep the historical `[0,1]` clamp. A non-finite generated\n    /// value becomes `0.0`, a deterministic finite safe value. Callers that\n    /// require rejection should use `try_from_fn` or `try_from_table`.\n    #[inline]\n    fn sanitize_generated_value(value: f32) -> f32 {\n        if value.is_finite() {\n            value.clamp(0.0, 1.0)\n        } else {\n            0.0\n        }\n    }\n\n    fn validate_table(table: &[f32; 256]) -> Result<(), CurveError> {\n        for (index, value) in table.iter().enumerate() {\n            if !value.is_finite() {\n                return Err(Self::non_finite_error(index));\n            }\n        }\n        Ok(())\n    }\n\n    fn non_finite_error(index: usize) -> CurveError {\n        CurveError::InvalidConfiguration(format!(\n            "CurveLut entry {index} must be finite"\n        ))\n    }\n'''
          if text.count(old_from_fn) != 1:
              raise SystemExit('unexpected from_fn anchor count')
          text = text.replace(old_from_fn, new_from_fn, 1)

          old_deser = '''        let mut table = [0.0f32; 256];\n        table.copy_from_slice(&vec);\n        Ok(CurveLut { table })\n'''
          new_deser = '''        let mut table = [0.0f32; 256];\n        table.copy_from_slice(&vec);\n        CurveLut::try_from_table(table).map_err(serde::de::Error::custom)\n'''
          if text.count(old_deser) != 1:
              raise SystemExit('unexpected deserialize anchor count')
          text = text.replace(old_deser, new_deser, 1)

          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-curve-lut-finite.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/openracing-curves/src/lut.rs .github/workflows/patch-curve-lut-finite.yml
          git commit -m 'fix(curves): enforce finite CurveLut values'
          git push origin HEAD:fix/curve-lut-finite-312
