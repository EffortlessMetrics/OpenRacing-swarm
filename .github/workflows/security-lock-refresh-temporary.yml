name: Temporary Security Lock Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "crates/plugins/Cargo.toml"
      - "crates/openracing-wasm-runtime/Cargo.toml"
      - ".github/workflows/security-lock-refresh-temporary.yml"

permissions:
  contents: read

concurrency:
  group: security-lock-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install repository toolchain
        run: rustup toolchain install nightly-2026-03-04 --profile minimal --no-self-update

      - name: Refresh vulnerable dependency resolutions
        run: |
          set -euo pipefail
          cargo update -p wasmtime@46.0.2 --precise 46.0.3
          cargo update -p wasmtime-wasi@46.0.2 --precise 46.0.3
          cargo update -p h2@0.4.13 --precise 0.4.16
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          grep -A2 'name = "h2"' Cargo.lock
          grep -A2 'name = "wasmtime"' Cargo.lock
          grep -A2 'name = "wasmtime-wasi"' Cargo.lock

      - name: Upload generated lockfile only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-lock-refresh-${{ github.event.pull_request.head.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
