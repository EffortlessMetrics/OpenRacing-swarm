name: Patch Telemetry Finite Scalars

on:
  push:
    branches: [fix/telemetry-finite-scalars-311]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/telemetry-finite-scalars-311
          fetch-depth: 1
      - name: Apply bounded telemetry validation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/telemetry-contracts/src/lib.rs')
          text = path.read_text()

          old_ffb = '''    /// Set FFB scalar value with clamping.\n    pub fn with_ffb_scalar(mut self, value: f32) -> Self {\n        self.ffb_scalar = Some(value.clamp(-1.0, 1.0));\n        self\n    }\n'''
          new_ffb = '''    /// Set FFB scalar value with finite-value validation and clamping.\n    pub fn with_ffb_scalar(mut self, value: f32) -> Self {\n        if value.is_finite() {\n            self.ffb_scalar = Some(value.clamp(-1.0, 1.0));\n        }\n        self\n    }\n'''
          if text.count(old_ffb) != 1:
              raise SystemExit('unexpected with_ffb_scalar anchor count')
          text = text.replace(old_ffb, new_ffb, 1)

          old_rpm = '''    /// Get RPM as fraction of redline (0.0-1.0).\n    pub fn rpm_fraction(&self, redline_rpm: f32) -> Option<f32> {\n        self.rpm.map(|rpm| (rpm / redline_rpm).clamp(0.0, 1.0))\n    }\n'''
          new_rpm = '''    /// Get RPM as fraction of a positive finite redline (0.0-1.0).\n    pub fn rpm_fraction(&self, redline_rpm: f32) -> Option<f32> {\n        if !redline_rpm.is_finite() || redline_rpm <= 0.0 {\n            return None;\n        }\n        self.rpm.map(|rpm| (rpm / redline_rpm).clamp(0.0, 1.0))\n    }\n'''
          if text.count(old_rpm) != 1:
              raise SystemExit('unexpected rpm_fraction anchor count')
          text = text.replace(old_rpm, new_rpm, 1)

          old_bad_tests = '''    #[test]\n    fn with_ffb_scalar_nan_clamps_to_value() {\n        // f32::NAN.clamp() returns NAN; the builder still wraps it in Some\n        let t = NormalizedTelemetry::new().with_ffb_scalar(f32::NAN);\n        assert!(t.ffb_scalar.is_some());\n    }\n\n    #[test]\n    fn with_ffb_scalar_infinity_clamps_to_one() {\n        let t = NormalizedTelemetry::new().with_ffb_scalar(f32::INFINITY);\n        assert_eq!(t.ffb_scalar, Some(1.0));\n    }\n\n    #[test]\n    fn with_ffb_scalar_neg_infinity_clamps_to_neg_one() {\n        let t = NormalizedTelemetry::new().with_ffb_scalar(f32::NEG_INFINITY);\n        assert_eq!(t.ffb_scalar, Some(-1.0));\n    }\n'''
          new_bad_tests = '''    #[test]\n    fn with_ffb_scalar_rejects_non_finite_values() {\n        for value in [f32::NAN, f32::INFINITY, f32::NEG_INFINITY] {\n            let telemetry = NormalizedTelemetry::new().with_ffb_scalar(value);\n            assert!(telemetry.ffb_scalar.is_none());\n            assert!(!telemetry.has_ffb_data());\n        }\n    }\n'''
          if text.count(old_bad_tests) != 1:
              raise SystemExit('unexpected non-finite FFB test anchor count')
          text = text.replace(old_bad_tests, new_bad_tests, 1)

          rpm_test_anchor = '''    #[test]\n    fn rpm_fraction_clamps_to_one() {\n        let t = NormalizedTelemetry::new().with_rpm(10000.0);\n        let frac = t.rpm_fraction(8000.0);\n        assert_eq!(frac, Some(1.0));\n    }\n'''
          rpm_test_replacement = rpm_test_anchor + '''\n    #[test]\n    fn rpm_fraction_rejects_invalid_redlines() {\n        let telemetry = NormalizedTelemetry::new().with_rpm(4000.0);\n        for redline in [\n            0.0,\n            -1.0,\n            f32::NAN,\n            f32::INFINITY,\n            f32::NEG_INFINITY,\n        ] {\n            assert!(\n                telemetry.rpm_fraction(redline).is_none(),\n                "invalid redline {redline:?} produced a fraction"\n            );\n        }\n    }\n\n    #[test]\n    fn rpm_fraction_preserves_positive_finite_boundaries() {\n        let zero = NormalizedTelemetry::new().with_rpm(0.0);\n        assert_eq!(zero.rpm_fraction(8000.0), Some(0.0));\n\n        let at_redline = NormalizedTelemetry::new().with_rpm(8000.0);\n        assert_eq!(at_redline.rpm_fraction(8000.0), Some(1.0));\n\n        let above = NormalizedTelemetry::new().with_rpm(9000.0);\n        assert_eq!(above.rpm_fraction(8000.0), Some(1.0));\n    }\n'''
          if text.count(rpm_test_anchor) != 1:
              raise SystemExit('unexpected RPM test anchor count')
          text = text.replace(rpm_test_anchor, rpm_test_replacement, 1)

          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-telemetry-finite-scalars.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/telemetry-contracts/src/lib.rs .github/workflows/patch-telemetry-finite-scalars.yml
          git commit -m 'fix(telemetry): reject invalid normalized scalars'
          git push origin HEAD:fix/telemetry-finite-scalars-311
