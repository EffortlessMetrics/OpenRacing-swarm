name: Security Hakari Refresh Temporary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/security-hakari-refresh-temporary.yml"

permissions:
  contents: write

concurrency:
  group: security-hakari-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/security-lock-rustsec-2026-0258-0268-0269'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the same-repository PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install cargo-hakari
        run: cargo +stable install cargo-hakari --locked

      - name: Regenerate and verify workspace-hack
        run: |
          set -euo pipefail
          cargo +stable hakari generate
          cargo +stable hakari verify
          git diff --check

      - name: Commit the generated files when they changed
        run: |
          set -euo pipefail
          if git diff --quiet -- workspace-hack/Cargo.toml Cargo.lock; then
            echo "Hakari state is already current."
            exit 0
          fi
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add workspace-hack/Cargo.toml Cargo.lock
          git commit -m "chore(deps): regenerate workspace-hack"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
