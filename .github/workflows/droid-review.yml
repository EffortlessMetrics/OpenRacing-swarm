name: Droid PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # Keep the active review running; GitHub retains only the newest pending run.
  group: droid-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  droid-review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The same bound key is written to the custom-model settings used by Droid.
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
    permissions:
      contents: read
      # Droid posts automatic and security findings as PR review comments.
      pull-requests: write
      # Droid may update its tracking comment on the PR issue conversation.
      issues: write
      # The action exchanges the GitHub OIDC identity for its app token.
      id-token: write
      # The action reads workflow-run metadata while publishing its result.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Mask bound credentials
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "::add-mask::$GITHUB_TOKEN"
          fi
          if [ -n "$MINIMAX_API_KEY" ]; then
            echo "::add-mask::$MINIMAX_API_KEY"
          fi

      - name: Configure MiniMax BYOK settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.factory"
          jq -n --arg api_key "$MINIMAX_API_KEY" \
            '{customModels: [{model: "MiniMax-M3", displayName: "MiniMax-M3", baseUrl: "https://api.minimax.io/anthropic", apiKey: $api_key, provider: "anthropic", maxOutputTokens: 64000}]}' \
            > "$HOME/.factory/settings.local.json"
          cp "$HOME/.factory/settings.local.json" "$RUNNER_TEMP/droid-settings.local.json"

      - name: Run Droid automatic and security review (advisory)
        id: droid
        continue-on-error: true
        uses: EffortlessMetrics/droid-action-safe@7c1377ccbacddc95560d1570547a5baa51de01ec # raw debug files are never uploaded
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          settings: ${{ runner.temp }}/droid-settings.local.json
          automatic_review: true
          automatic_security_review: true
          security_block_on_critical: false
          security_block_on_high: false
          upload_debug_artifacts: false
          show_full_output: false

      - name: Report advisory review failure
        if: always() && steps.droid.outcome == 'failure'
        shell: bash
        run: echo "::warning::Droid review was advisory and failed; deterministic repository checks remain authoritative."

      - name: Remove transient BYOK settings
        if: always()
        shell: bash
        run: |
          rm -f -- \
            "$HOME/.factory/settings.local.json" \
            "$RUNNER_TEMP/droid-settings.local.json"
