  "WheelService owns one shared game service and one shared plugin registry service.",
  "The daemon reuses the owned game service for gRPC composition.",
  "Focused virtual/offline tests prove both accessors without hardware or network dependence.",
]

claim_boundaries = [
  "This lane is service composition only; it does not claim game detection, telemetry monitoring, plugin execution, hardware, FFB, or support readiness.",
  "No work item adds network, allocation, lock, or application I/O to the 1 kHz engine/FFB path.",
]

status_docs = [
