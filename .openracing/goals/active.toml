id = "external-control-stream-lane"
title = "External observe-only control stream"
status = "active"
owner = "platform/service"
created = "2026-07-18"

proposal = "docs/proposals/OR-PROP-0004-external-control-stream.md"
plan = "plans/external-control-stream/implementation-plan.md"
handoff = "plans/external-control-stream/handoff.md"

specs = [
  "docs/specs/OR-SPEC-0005-external-control-stream.md",
]

adrs = [
  "docs/adr/0010-non-rt-control-stream-boundary.md",
]

objective = """
Deliver the vendor-neutral, observe-only external control stream through
bounded non-real-time service and IPC seams, one plan work item per PR, while
preserving the 1 kHz FFB path and all hardware/output/support claim boundaries.
"""

end_state = [
  "The versioned control stream is available only when its backing service is enabled and negotiated.",
  "Descriptor, non-actionable baseline, ordered input events, reset/gap, and disconnect semantics are proven by virtual/fake and packaged-artifact receipts.",
  "Diagnostics, replay, release, and consumer handoffs are separately proven without adding application-specific control claims.",
]

claim_boundaries = [
  "This lane observes decoded or virtual input only; it does not claim named physical controls.",
  "No work item authorizes hardware output, FFB, high torque, profile mutation, or safety-state changes.",
  "No work item makes Runbook a domain, IPC, packaging, or product dependency.",
  "No network, allocation, lock, or application I/O is added to the 1 kHz engine/FFB path.",
  "Platform, release, and support claims require receipts from the exact producing lane.",
]

status_docs = [
  "docs/proposals/OR-PROP-0004-external-control-stream.md",
  "docs/specs/OR-SPEC-0005-external-control-stream.md",
  "docs/adr/0010-non-rt-control-stream-boundary.md",
  "plans/external-control-stream/implementation-plan.md",
  "plans/external-control-stream/handoff.md",
  "plans/moza-native-visible-lane/closeout.md",
]

